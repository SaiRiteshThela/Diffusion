# Experiment 4: keep the Experiment 2 winning architecture unchanged and test
# stepped learning-rate decay plus EMA weights.

source:
  baseline_run: private-wandb-run
  target_val_loss: 0.12398386746644974

time_embedding:
  time_emb_dim: 128
  scaled_time_emb_dim: 256

unet:
  in_channels: 1
  start_dim: 96
  dim_mults: [1, 2, 4]
  residual_blocks_per_group: 1
  group_norm_num_groups: 8
  time_emb_dim: 256
  n_heads: 2
  d_ff: 512
  attn_dropout: 0.2
  ffn_dropout: 0.1
  proj_dropout: 0.0
  activation: gelu

data:
  image_size: 32
  batch_size: 32
  val_size: 5000
  seed: 42

training:
  num_steps: 17190
  optimizer: adam
  learning_rate: 0.0001
  lr_milestones: [10000, 14000]
  lr_gamma: 0.3
  ema_decay: 0.999
  weight_decay: 0.0
  max_grad_norm: null
  checkpoint_every: 500
  val_every: 100
  val_batches: 16
  plot_every: 500

sampling:
  num_samples: 25
  ode_steps: 1000
