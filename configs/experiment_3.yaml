# Experiment 3: our Experiment 2 winning architecture trained with the
# Michedev/flow-matching-mnist optimization profile.
#
# The reference uses the same conditional OT velocity-MSE objective, Adam,
# lr=1e-4, batch_size=32, and 10 epochs. Our sampler is step-based, so 17,190
# steps equals 10 passes over the 55,000-image training split at batch size 32.

source:
  repository: https://github.com/Michedev/flow-matching-mnist
  target_val_loss: 0.1245514452457428

time_embedding:
  time_emb_dim: 128
  scaled_time_emb_dim: 256

# Keep the verified Experiment 2 winner unchanged.
unet:
  in_channels: 1
  start_dim: 96
  dim_mults: [1, 2, 4]
  residual_blocks_per_group: 1
  group_norm_num_groups: 8
  time_emb_dim: 256
  n_heads: 2
  d_ff: 512
  attn_dropout: 0.2
  ffn_dropout: 0.1
  proj_dropout: 0.0
  activation: gelu

data:
  image_size: 32
  batch_size: 32
  train_size: 55000
  val_size: 5000
  seed: 42

training:
  num_steps: 17190
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: null
  checkpoint_every: 500
  val_every: 100
  val_batches: 16
  plot_every: 500

sampling:
  num_samples: 25
  ode_steps: 1000

test:
  batch_size: 2
  image_size: 32
